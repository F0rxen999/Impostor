<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>IMPOSTOR WILD CARD UPDATE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #6366f1;
    --primary-glow: rgba(99, 102, 241, 0.5);
    --accent: #06b6d4;
    --impostor: #ff3b30;
    --impostor-glow: rgba(255, 59, 48, 0.5);
    --wild: #d946ef;
    --wild-glow: rgba(217, 70, 239, 0.5);
    --text: #ffffff;
    --text-dim: #94a3b8;
    --glass: rgba(15, 23, 42, 0.85);
    --glass-border: rgba(255, 255, 255, 0.1);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
   
  body {
    font-family: 'Outfit', sans-serif;
    background: #0f172a;
    color: var(--text);
    height: 100dvh;
    overflow: hidden;
    position: relative;
  }

  /* --- TŁA --- */
  .bg-mesh {
    position: fixed; inset: -50%;
    background: radial-gradient(circle at 50% 50%, rgba(99,102,241,0.15), transparent 60%),
                radial-gradient(circle at 80% 20%, rgba(6,182,212,0.15), transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(239,68,68,0.1), transparent 50%);
    animation: meshMove 20s infinite alternate linear;
    z-index: -2;
    transition: all 0.8s ease-in-out;
    transform-origin: center;
  }
  
  /* TŁO WESTERN */
  .bg-mesh.bg-wild-west {
    animation: none;
    inset: 0;
    transform: scale(1) !important;
    background: 
        linear-gradient(to top, #1a120b 0%, #3a2618 35%, transparent 35.1%),
        linear-gradient(to bottom, #020617 0%, #1e1b4b 40%, #9333ea 70%, #f97316 100%);
    background-color: #0f172a;
  }

  @keyframes meshMove {
    0% { transform: rotate(0deg) scale(1); }
    100% { transform: rotate(10deg) scale(1.1); }
  }
